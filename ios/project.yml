# XcodeGen spec. Regenerate the project with `xcodegen generate` (brew install xcodegen).
# The checked-in Metanav.xcodeproj is generated from this file; edit here, not in Xcode.
name: Metanav
options:
  bundleIdPrefix: com.metanav
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0
  MetanavCore:
    path: MetanavCore

targets:
  Metanav:
    type: application
    platform: iOS
    sources:
      - path: Metanav
        excludes:
          - "Models/**/*.part"
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetanavCore
        product: MetanavCore
    settings:
      base:
        # Hand-written plist (XcodeGen's `info:` would regenerate and flatten it).
        INFOPLIST_FILE: Metanav/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.metanav.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic
        # Set your team in Xcode (Signing & Capabilities) or here.
        DEVELOPMENT_TEAM: ""
        # Developer Mode in the Meta AI app accepts "0". Release channels need real values.
        META_APP_ID: "0"
        CLIENT_TOKEN: "0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        COREML_CODEGEN_LANGUAGE: None
    preBuildScripts:
      - name: Check ML models are present
        script: |
          if [ ! -d "${SRCROOT}/Metanav/Models/DepthAnythingV2SmallF16.mlpackage" ]; then
            echo "error: Depth model missing. Run scripts/fetch-models.sh ios from the repo root, then run 'xcodegen generate' in ios/ and rebuild."
            exit 1
          fi
        basedOnDependencyAnalysis: false

schemes:
  Metanav:
    build:
      targets:
        Metanav: all
    run:
      config: Debug
    archive:
      config: Release
